<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My AI Chatbot</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 h-screen flex flex-col font-sans">
  <header class="bg-black p-4 shadow-md text-center font-bold text-xl text-white">AI Assistant</header>
  
  <main id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-3xl mx-auto w-full">
    <div class="text-left"><span class="bg-gray-800 px-4 py-2 rounded-lg inline-block">Hello! How can I help you today?</span></div>
  </main>

  <footer class="bg-black p-4 sticky bottom-0">
    <div class="max-w-3xl mx-auto flex gap-2">
      <input type="text" id="user-input" class="flex-1 rounded-lg bg-gray-800 p-3 text-white outline-none focus:ring-1 focus:ring-red-700" placeholder="Type a message...">
      <button onclick="sendMessage()" class="bg-gradient-to-r from-red-800 via-red-700 to-black hover:from-red-700 text-white px-6 py-3 rounded-lg font-bold transition">Send</button>
    </div>
  </footer>

  <script>
    async function sendMessage() {
      const input = document.getElementById('user-input');
      const box = document.getElementById('chat-box');
      const msg = input.value.trim();
      if (!msg) return;

      // Display user message
      box.innerHTML += `<div class="text-right"><span class="bg-gradient-to-r from-red-800 to-red-900 px-4 py-2 rounded-lg inline-block text-white">${msg}</span></div>`;
      input.value = '';
      box.scrollTop = box.scrollHeight;

      try {
        // Send to your backend
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: msg })
        });
        const data = await res.json();
        
        // Display AI response
        box.innerHTML += `<div class="text-left"><span class="bg-gray-800 px-4 py-2 rounded-lg inline-block">${data.reply}</span></div>`;
        box.scrollTop = box.scrollHeight;
      } catch (e) {
        box.innerHTML += `<div class="text-left text-red-500">Error connecting to AI.</div>`;
      }
    }
  </script>
</body>
</html>
