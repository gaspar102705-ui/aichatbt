<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My AI Chatbot</title>
  <!-- 1. Tailwind with Typography plugin for beautiful text formatting -->
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <!-- 2. Marked.js to translate AI Markdown into HTML -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 h-screen flex flex-col font-sans">
  <header class="bg-black p-4 shadow-md text-center font-bold text-xl text-white">AI Assistant</header>
  
  <main id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-3xl mx-auto w-full">
    <div class="text-left"><span class="bg-gray-800 px-4 py-2 rounded-lg inline-block">Hello! I am ready to learn.</span></div>
  </main>

  <footer class="bg-black p-4 sticky bottom-0">
    <div class="max-w-3xl mx-auto flex gap-2">
      <input type="text" id="user-input" class="flex-1 rounded-lg bg-gray-800 p-3 text-white outline-none focus:ring-1 focus:ring-red-700" placeholder="Type a message...">
      <button onclick="sendMessage()" class="bg-gradient-to-r from-red-800 via-red-700 to-black hover:from-red-700 text-white px-6 py-3 rounded-lg font-bold transition">Send</button>
    </div>
  </footer>

  <script>
    let chatHistory = [
      { role: "system", content: "You are a helpful, smart AI assistant." }
    ];

    async function sendMessage() {
      const input = document.getElementById('user-input');
      const box = document.getElementById('chat-box');
      const msg = input.value.trim();
      if (!msg) return;

      chatHistory.push({ role: "user", content: msg });
      
      box.innerHTML += `<div class="text-right"><span class="bg-gradient-to-r from-red-800 to-red-900 px-4 py-2 rounded-lg inline-block text-white">${msg}</span></div>`;
      input.value = '';
      box.scrollTop = box.scrollHeight;

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: chatHistory })
        });
        const data = await res.json();
        
        chatHistory.push({ role: "assistant", content: data.reply });

        // 3. Parse the Markdown and apply Tailwind 'prose' classes
        const formattedReply = marked.parse(data.reply || "");
        box.innerHTML += `<div class="text-left"><div class="bg-gray-800 px-4 py-4 rounded-lg inline-block prose prose-invert max-w-none">${formattedReply}</div></div>`;
        box.scrollTop = box.scrollHeight;
      } catch (e) {
        box.innerHTML += `<div class="text-left text-red-500">Error connecting to AI.</div>`;
      }
    }
  </script>
</body>
</html>
